name: Keepalive Supabase

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Una consulta REST real (toca Postgres, no solo el gateway) cada 3 días lo evita.
# Secrets del repo: SUPABASE_URL y SUPABASE_ANON_KEY (los mismos VITE_* de Vercel).

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta a la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL / SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/rulesets?select=version&limit=1")
          echo "HTTP $status"
          case "$status" in 2*) ;; *) exit 1 ;; esac
